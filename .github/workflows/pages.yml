name: Publish PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact is not visible yet; retry this workflow.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
